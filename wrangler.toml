# Cloudflare Pages / Workers configuration
name = "portfolio"
compatibility_date = "2026-08-25"
pages_build_output_dir = "dist"

# Runtime Environment Variables (Secrets must be set via `wrangler secret put <KEY>` or Cloudflare dashboard)
# - RESEND_API_KEY
# - TURNSTILE_SECRET_KEY
[vars]
CONTACT_TO_EMAIL = "contact@example.com"
CONTACT_FROM_EMAIL = "onboarding@resend.dev"

# Rate Limiting configuration:
# For production edge rate limiting on /api/contact, configure Cloudflare WAF / Rate Limiting Rules
# in the Cloudflare dashboard or via Zone Rulesets (e.g. 5 requests per 10 minutes per IP).
