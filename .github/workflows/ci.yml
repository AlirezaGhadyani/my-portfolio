name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build site + exports
        run: pnpm build:all

      - name: Verify critical files exist
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/_headers
          test -f dist/og-image.svg
          test -f dist/downloads/resume-ats.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Placeholder for Cloudflare Pages deployment
        run: echo "Deploy dist/ to Cloudflare Pages via your Git integration or API token."